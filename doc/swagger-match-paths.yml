  /api/match/swipes/:
    get:
      summary: Returns a list with all the matches
      parameters:
        - in: header
          name: x-token
          description: The user active JWT token
          schema:
           type: string
           format: JWT
          required: true
        - in: query
          name: swiper_id
          description: The id of the user being searched
          schema:
            type: string
          required: false
        - in: query
          name: swiper_names 
          description: The name or part of the name of one of either the qualificated or qualificator.
          schema:
            type: string
          required: false
        - in: query
          name: superlikes
          description: True if retrieved swipes should contain superlikes 
          schema:
            type: bool
          required: false
        - in: query
          name: matchs
          description: True if retrieved swipes should contain only matchs 
          schema:
            type: bool
          required: false
        - in: query
          name: pending
          schema:
            type: bool
          required: false
        - in: query
          name: likes
          schema:
            type: bool
          required: false
        - in: query
          name: dislikes
          schema:
            type: bool
          required: false
        - in: query
          name: blocked
          description: True if retrieved swipes should contain blocked matches, False if shouldn't be returned.
          schema:
            type: bool
          required: false
      tags: [Match]
      responses:
            200:
                description: Successful response
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                type: object
                                $ref: '#/components/schemas/MatchSwipesItem'
            422:
                description: Validation Error.
                content:
